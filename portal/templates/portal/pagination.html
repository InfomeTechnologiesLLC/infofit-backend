{% if page.paginator.num_pages > 1 %}
<nav aria-label="Pages"><ul class="pagination mb-0">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if state %}&amp;status={{ state }}{% endif %}">Previous</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if state %}&amp;status={{ state }}{% endif %}">Next</a></li>{% endif %}
</ul></nav>
{% endif %}
