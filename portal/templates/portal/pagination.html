{% load portal_extras %}{% if page.paginator.num_pages > 1 %}
<nav aria-label="Pages" class="d-flex justify-content-between align-items-center flex-wrap gap-2">
  <span class="small text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="{% page_url page.previous_page_number %}"><i class="bi bi-chevron-left"></i> Previous</a></li>{% endif %}
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="{% page_url page.next_page_number %}">Next <i class="bi bi-chevron-right"></i></a></li>{% endif %}
  </ul>
</nav>
{% endif %}
