{% extends 'portal/base.html' %}
{% block login_content %}
<main class="container py-5" style="max-width:440px">
  <div class="card p-4 mt-5">
    <h1 class="brand h3 mb-1">INFOME FIT</h1>
    <p class="text-muted mb-4">Sign in to the staff portal</p>
    <form method="post">{% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}
        <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
      {% endfor %}
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
  </div>
</main>
{% endblock %}
